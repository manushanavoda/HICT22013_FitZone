<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Page</title>
    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="navBar.css">
</head>
<body>

    <header class="navbar-header">
        <nav class="navbar">
        
            <div class="nav-logo">
                <a href="Home.html">
                <img src="pictures/logo-removebg-preview.png" alt="FitZone Logo">
                </a>
            </div>

            
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="schedules.html" class="nav-link">Schedule</a></li>
                <li><a href="Diet_plan1.html" class="nav-link">Diet Plan</a></li>
                <li><a href="#about" class="nav-link">About Us</a></li>
                <li><a href="feedback.html" class="nav-link">Feedback</a></li>
            </ul>

            
            <div class="nav-btn-container">
                <a href="contact.html" class="nav-contact-btn">Contact Us</a>
            </div>
        </nav>

  </header>


    <main>

        <section class="feedback-form">
            <h2>Send Your Feedback</h2>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>Web Development</option>
                    <option>Programming</option>
                    <option>Database</option>
                </select>

                <label>Rating</label>

                <div class="rating">
                    <label><input type="radio" name="rate"> Excellent</label>
                    <label><input type="radio" name="rate"> Good</label>
                    <label><input type="radio" name="rate"> Average</label>
                    <label><input type="radio" name="rate"> Poor</label>
                </div>

                <label>Comments</label>
                <textarea rows="5" placeholder="Write your feedback..."></textarea>

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Clear</button>
                </div>

            </form>
        </section>

        <aside>
            <h2>Why Feedback?</h2>

            <p>
                Your feedback helps improve our services.
            </p>
        </aside>

    </main>

    <footer>
        <p>© 2026 Feedback System</p>
    </footer>

</body>
</html>
