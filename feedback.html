<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Feedback System</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Feedback</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main>

        <section class="feedback-form">
            <h2>Send Your Feedback</h2>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>Web Development</option>
                    <option>Programming</option>
                    <option>Database</option>
                </select>

                <label>Rating</label>

                <div class="rating">
                    <label><input type="radio" name="rate"> Excellent</label>
                    <label><input type="radio" name="rate"> Good</label>
                    <label><input type="radio" name="rate"> Average</label>
                    <label><input type="radio" name="rate"> Poor</label>
                </div>

                <label>Comments</label>
                <textarea rows="5" placeholder="Write your feedback..."></textarea>

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Clear</button>
                </div>

            </form>
        </section>

        <aside>
            <h2>Why Feedback?</h2>

            <p>
                Your feedback helps improve our teaching methods and
                learning experience.
            </p>
        </aside>

    </main>

    <footer>
        <p>© 2026 Student Feedback System</p>
    </footer>

</body>
</html>
