<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone - Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <main class="contact-main-grid">
        
        <section class="contact-card form-wrapper">
            <h2>Get In Touch</h2>
            <p class="subtitle">Have questions about our workout schedules or diet plans? Send us a message and our team will get back to you shortly.</p>
            
            <form action="#" method="POST" class="vertical-flex-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email address">
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" required placeholder="How can we help you?">
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>

        <section class="contact-info-panel">
            
            <div class="info-cards-container">
                <div class="info-box">
                    <span class="icon">📞</span>
                    <div>
                        <h3>Call Us</h3>
                        <p>+94 71 234 5678</p>
                    </div>
                </div>

                <div class="info-box">
                    <span class="icon">✉️</span>
                    <div>
                        <h3>Email Us</h3>
                        <p>info@fitzone.com</p>
                    </div>
                </div>
            </div>

            <div class="social-wrapper">
                <h3>Follow Our Community</h3>
                <div class="social-links">
                    <a href="#" class="social-icon">Facebook</a>
                    <a href="#" class="social-icon">Instagram</a>
                    <a href="#" class="social-icon">YouTube</a>
                    <a href="#" class="social-icon">X</a>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
