<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone Schedules</title>
    <link rel="stylesheet" href="home.css">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Navbar Styling */
        .navbar-custom {
            background-color: #000000;
            border-bottom: 3px solid #198754; /* Green border line below navbar */
        }
        .navbar-custom .nav-link {
            color: #ffffff;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
        }
        .navbar-custom .nav-link:hover, 
        .navbar-custom .nav-link.active {
            color: #198754;
        }

        /* Body & Background */
        body {
            background: linear-gradient(rgba(245, 247, 250, 0.85), rgba(245, 247, 250, 0.85)), 
                        url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            min-height: 100vh;
        }

        /* Titles */
        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #212529;
        }
        .main-title span {
            color: #198754;
        }
        .sub-title {
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Card Container */
        .filter-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .filter-card-body {
            padding: 35px;
        }

        .filter-heading {
            font-size: 1.25rem;
            font-weight: 700;
            color: #212529;
        }

        /* Form Controls */
        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-select, .form-control {
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 10px 14px;
            color: #212529;
            font-size: 0.9rem;
            background-color: #f8f9fa;
        }

        .form-select:focus, .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
            background-color: #ffffff;
        }

        /* Buttons */
        .btn-clear {
            border: 1px solid #ced4da;
            color: #6c757d;
            background-color: #ffffff;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .btn-clear:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        .btn-search {
            background-color: #198754;
            color: #ffffff;
            font-weight: 600;
            border: none;
            padding: 10px 45px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-search:hover {
            background-color: #146c43;
            color: #ffffff;
        }

        /* Bottom Banner */
        .bottom-green-bar {
            background-color: #198754;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 500;

</head>
<body>

    <!-- Top Navigation Bar -->
     <nav>
    <ul>

        <li><a href="index.html">Home</a></li>

        <li class="dropdown">
            <a href="/schedules.html">Schedule ▼</a>

        </li>

        <li class="dropdown">

        <li><a href="feedback.html">Feedback</a></li>

        <li><a href="contact.html">Contact Us</a></li>

    </ul>
</nav>

    <!-- Main Content -->
    <div class="container py-5">
        <!-- Main Title -->
        <div class="text-center mb-4">
            <h1 class="main-title">FitZone <span>Schedules</span></h1>
            <p class="sub-title">Find your perfect workout routine</p>
        </div>

        <!-- Filter Form Card -->
        <div class="row justify-content-center">
            <div class="col-lg-11 col-xl-10">
                <div class="filter-card">
                    
                    <div class="filter-card-body">
                        <form id="filterForm" onsubmit="handleSearch(event)">
                            <!-- Header -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h2 class="filter-heading m-0">Filter Schedules</h2>
                                <button type="button" class="btn btn-clear" onclick="resetForm()">Clear All</button>
                            </div>

                            <!-- Row 1: Select Inputs -->
                            <div class="row g-3 mb-4">
                                <div class="col-md">
                                    <label class="form-label">Workout Type</label>
                                    <select class="form-select" id="workoutType">
                                        <option value="" selected>All Types</option>
                                        <option value="home">Home Workout</option>
                                        <option value="gym">Gym Workout</option>
                                    </select>
                                </div>
                                <div class="col-md">
                                    <label class="form-label">Goal</label>
                                    <select class="form-select" id="goal">
                                        <option value="" selected>All Goals</option>
                                        <option value="loss">Weight Loss</option>
                                        <option value="gain">Muscle Gain</option>
                                    </select>
                                </div>
                                <div class="col-md">
                                    <label class="form-label">Experience</label>
                                    <select class="form-select" id="level">
                                        <option value="" selected>All Levels</option>
                                        <option value="beginner">Beginner</option>
                                        <option value="intermediate">Intermediate</option>
                                        <option value="advanced">Advanced</option>
                                    </select>
                                </div>
                                <div class="col-md">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="Gender">
                                        <option value="" selected>All Genders</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                </div>
                                <div class="col-md">
                                    <label class="form-label">Focus Area</label>
                                    <select class="form-select" id="Area">
                                        <option value="" selected>All Areas</option>
                                        <option value="full">Full Body</option>
                                        <option value="upper">Upper Body</option>
                                        <option value="abs">Abs & Glutes</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Row 2: Height & Weight Inputs -->
                            <div class="row g-3 mb-4">
                                <div class="col-sm-6 col-md-3 col-lg-2">
                                    <label class="form-label">Height (CM)</label>
                                    <input type="number" class="form-control" placeholder="e.g. 175">
                                </div>
                                <div class="col-sm-6 col-md-3 col-lg-2">
                                    <label class="form-label">Weight (KG)</label>
                                    <input type="number" class="form-control" placeholder="e.g. 70">
                                </div>
                            </div>

                            <!-- Search Button -->
                            <div class="text-center pt-2">
                                <button type="submit" class="btn btn-search">Search</button>
                            </div>
                        </form>
                    </div>

                    <!-- Bottom Banner -->
                    <div class="bottom-green-bar">
                        Find your perfect workout schedule to reach your goals.
                    </div>

                </div>
            </div>
        </div>
    </div>

        const workoutType = document.getElementById('workoutType').value;

        }
        // 4. Gym Workout විතරක් තේරුවොත්

        else {
            window.location.href = 'all-schedules.html';

    }

    // Clear All Button එක සඳහා
    function resetForm() {
        document.getElementById("filterForm").reset();
    }
</script>
