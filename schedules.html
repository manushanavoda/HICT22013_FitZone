<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone - Workout Schedules</title>
    <style>
        /* Dark Mode UI Colors */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Dark gradient overlay එකක් සමඟ Gym background image එකක් එකතු කර ඇත */
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            padding: 3rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            color: #818cf8;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Filter Section Styling */
        .filter-section {
            background-color: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px); 
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .filter-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .clear-btn {
            background-color: #374151;
            color: #d1d5db;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background-color: #4b5563;
            color: white;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        
        .filter-group select, .filter-group input {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .filter-group input {
            cursor: text;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--primary);
        }

        /* Search Button Container */
        .search-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            max-width: 200px;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        .search-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FitZone Schedules</h1>
        <p>Find your perfect workout routine</p>
    </header>

    <div class="filter-section">
        <div class="filter-header">
            <h3>Filter Schedules</h3>
            <button class="clear-btn" onclick="resetFilters()">Clear All</button>
        </div>
        
        <div class="filter-grid">
            <div class="filter-group">
                <label>Workout Type</label>
                <select id="workoutType">
                    <option value="all">All Types</option>
                    <option value="home">Home Workout</option>
                    <option value="gym">Gym Workout</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Goal</label>
                <select id="goal">
                    <option value="all">All Goals</option>
                    <option value="loss">Weight Loss</option>
                    <option value="gain">Weight Gain</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Experience</label>
                <select id="experience">
                    <option value="all">All Levels</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="all">All Genders</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Focus Area</label>
                <select id="focusArea">
                    <option value="all">All Areas</option>
                    <option value="fullbody">Full Body</option>
                    <option value="upper">Upper Body</option>
                    <option value="abs">Abs & Glutes</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 175" min="0">
            </div>

            <div class="filter-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 70" min="0">
            </div>
        </div>

        <div class="search-container">
            <button class="search-btn" onclick="searchSchedules()">Search</button>
        </div>
    </div>
</div>

<script>
    function searchSchedules() {
        const type = document.getElementById('workoutType').value;
        const goal = document.getElementById('goal').value;
        const exp = document.getElementById('experience').value;
        const gender = document.getElementById('gender').value;
        const focus = document.getElementById('focusArea').value;
        const height = document.getElementById('height').value;
        const weight = document.getElementById('weight').value; 

        console.log("Searching for:", { type, goal, exp, gender, focus, height, weight });
        alert(`Searching for:\nType: ${type}\nGoal: ${goal}\nExperience: ${exp}\nGender: ${gender}\nFocus: ${focus}\nHeight: ${height ? height + ' cm' : 'Not specified'}\nWeight: ${weight ? weight + ' kg' : 'Not specified'}`);
    }

    function resetFilters() {
        document.getElementById('workoutType').value = 'all';
        document.getElementById('goal').value = 'all';
        document.getElementById('experience').value = 'all';
        document.getElementById('gender').value = 'all';
        document.getElementById('focusArea').value = 'all';
        document.getElementById('height').value = ''; 
        document.getElementById('weight').value = ''; 
    }
</script>

</body>
</html>
